name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-companion:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run native Windows UI Automation smoke test
        shell: powershell -NoProfile -NonInteractive -MTA -File {0}
        run: ./cmd/opticdeck-win/smoke.ps1

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tigervnc-standalone-server openbox at-spi2-core dbus dbus-x11 x11-utils libgtk-3-bin xfonts-base fonts-dejavu-core xterm zenity
      - name: Unit tests
        run: make test
      - name: Race detector
        run: make race
      - name: Static analysis
        run: make vet
      - name: Browser overlay tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          CHROMIUM_EXECUTABLE="$(node -p 'require("playwright").chromium.executablePath()')" make frontend-test
      - name: Build and session integration
        run: make smoke
      - name: Live browser and GTK session
        run: |
          state=$(mktemp -d)
          trap './bin/semadesk stop --state-dir "$state" >/dev/null 2>&1 || true; rm -f "$state/daemon.log" "$state/session.lock"; rmdir "$state" 2>/dev/null || true' EXIT
          ./bin/semadesk start --state-dir "$state" >/dev/null
          ./bin/semadesk launch --state-dir "$state" -- gtk-builder-tool preview "$PWD/tests/fixture.ui" >/dev/null
          CHROMIUM_EXECUTABLE="$(node -p 'require("playwright").chromium.executablePath()')" \
            SEMADESK_STATE="$state/state.json" node tests/browser.cjs
